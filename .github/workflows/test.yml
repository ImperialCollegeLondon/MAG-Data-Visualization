name: MATLAB Tests
# Branches are tested through pull requests, so that a push to a pull request
# does not run the tests twice. Use "workflow_dispatch" to test a branch with
# no pull request.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1

  build:
    name: Build MATLAB Toolbox
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3.1.0
        with:
          release: R2026b
      - name: Validate version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "v$(jq -r .version resources/mpackage.json)" != "$GITHUB_REF_NAME" ]; then
            echo "Version mismatch between tag and package definition"
            exit 1
          fi
      - name: Check code and package toolbox
        uses: matlab-actions/run-build@v3.4.0
        with:
          tasks: check package
      - name: Upload toolbox
        uses: actions/upload-artifact@v7.0.2
        with:
          name: toolbox
          path: artifacts/MAG Data Visualization.mltbx
          if-no-files-found: error
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.39.3
        if: success() || failure()
        with:
          sarif_file: artifacts/issues.sarif

  test:
    name: Run MATLAB Tests
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # R2026b tests source code, as it is the only release that can read the
        # package definition. Older releases test the toolbox built above.
        # Draft pull requests only run R2026b, for quicker feedback.
        release: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.draft) && '["R2026b"]' || '["R2025a", "R2025b", "R2026a", "R2026b"]') }}
    runs-on: windows-latest
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3.1.0
        with:
          release: ${{ matrix.release }}
          products: MATLAB_Test Parallel_Computing_Toolbox Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Text_Analytics_Toolbox Wavelet_Toolbox
          cache: true
      - name: Download toolbox
        uses: actions/download-artifact@v8.0.2
        if: matrix.release != 'R2026b'
        with:
          name: toolbox
      - name: Download CDF support package
        uses: robinraju/release-downloader@v1.13
        with:
          repository: ImperialCollegeLondon/MATLAB-SPDF-CDF
          tag: v3.9.1
          fileName: MATLAB.SPDF.CDF.mltbx
          token: ${{ secrets.MATLAB_SUPPORT_PACKAGES_TOKEN }}
          tarBall: false
          zipBall: false
      - name: Download SPICE support package
        uses: robinraju/release-downloader@v1.13
        with:
          repository: ImperialCollegeLondon/MATLAB-SPICE
          tag: N0067
          fileName: MATLAB.SPICE.MICE.mltbx
          token: ${{ secrets.MATLAB_SUPPORT_PACKAGES_TOKEN }}
          tarBall: false
          zipBall: false
      - name: Run tests in parallel
        uses: matlab-actions/run-build@v3.4.0
        with:
          tasks: test:parallel
          build-options: -parallel
      - name: Run tests serially
        uses: matlab-actions/run-build@v3.4.0
        if: success() || failure()
        with:
          tasks: test:serial
      - name: Run UI tests
        uses: matlab-actions/run-build@v3.4.0
        if: success() || failure()
        timeout-minutes: 40
        with:
          tasks: test:ui
      - name: Merge coverage
        uses: matlab-actions/run-build@v3.4.0
        if: (success() || failure()) && matrix.release == 'R2026b'
        with:
          tasks: coverage
      - name: Report results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: MATLAB Test Results (${{ matrix.release }})
          path: 'results-*.xml'
          working-directory: 'artifacts'
          reporter: java-junit
          use-actions-summary: 'false'
      - name: Report coverage
        uses: 5monkeys/cobertura-action@ee5787cc56634acddedc51f21c7947985531e6eb # v14
        if: matrix.release == 'R2026b'
        with:
          path: 'artifacts/coverage.xml'
          minimum_coverage: 80
          skip_covered: true
          report_name: Coverage Report (${{ matrix.release }})

  release:
    name: Publish MATLAB Toolbox
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download toolbox
        uses: actions/download-artifact@v8.0.2
        with:
          name: toolbox
      - name: Create release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.ref_name }}
          artifacts: 'MAG Data Visualization.mltbx'
          bodyFile: 'resources/release-notes.md'
